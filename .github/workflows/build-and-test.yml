name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore BAnalyzer.sln

    - name: Build solution (Release|x64)
      run: msbuild BAnalyzer.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Run tests
      run: dotnet test x64/Release/BAnalyzerCoreTest.dll --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/**/*.trx

    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BAnalyzer-Release-x64
        path: |
          x64/Release/*.exe
          x64/Release/*.dll
          x64/Release/*.json
          x64/Release/runtimes/**/*
        retention-days: 30
